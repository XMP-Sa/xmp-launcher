name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Syntax check
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/ase.js
          node --check electron/installer.js
          node --check electron/store.js
          node --check electron/config.js
          node --check electron/client.js
          node --check src/app.js
